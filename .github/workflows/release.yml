name: Preview release
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vibe-release"
          mkdir -p "$OUT"
          npm run demo -- --output "$OUT"
          npm pack --ignore-scripts --pack-destination "$OUT"
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --prefix "$RUNNER_TEMP/vibe-installed" --ignore-scripts --no-audit --no-fund "$OUT/vibe-surgeon-$VERSION.tgz"
          BIN="$RUNNER_TEMP/vibe-installed/node_modules/vibe-surgeon/bin/vibe-surgeon.mjs"
          test "$(node "$BIN" --version)" = "$VERSION"
          node "$BIN" scan . --json > "$RUNNER_TEMP/installed-scan.json"
          (cd "$OUT" && sha256sum *.tgz report.html evidence.json transcript.txt > SHA256SUMS)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish versioned preview (never overwrite an existing release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v$VERSION" "$RUNNER_TEMP/vibe-release/"* \
            --target "$COMMIT_SHA" --prerelease \
            --title "Vibe Surgeon $VERSION — public preview" \
            --notes-file "docs/releases/$VERSION.md"

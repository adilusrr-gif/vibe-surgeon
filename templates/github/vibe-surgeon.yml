name: Vibe Surgeon

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Scan repository
        run: npx -y vibe-surgeon@latest scan .

      - name: Guard change blast radius
        if: github.event_name == 'pull_request'
        run: npx -y vibe-surgeon@latest guard . --base "${{ github.event.pull_request.base.sha }}"

      - name: Generate SARIF
        run: npx -y vibe-surgeon@latest sarif . --output vibe-surgeon.sarif

      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: vibe-surgeon.sarif
          category: vibe-surgeon
